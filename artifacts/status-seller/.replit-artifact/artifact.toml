kind = "mobile"
previewPath = "/"
title = "StatusSeller"
version = "1.0.0"
id = "artifacts/status-seller"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20683

[services.development]
run = "pnpm --filter @workspace/status-seller run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/status-seller", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/status-seller", "run", "serve" ]

[services.env]
PORT = "20683"
BASE_PATH = "/"
